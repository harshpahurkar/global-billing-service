[project]
name = "global-billing-service"
version = "1.0.0"
description = "Scalable billing and subscription management microservice"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Harsh Pahurkar"},
]
keywords = ["billing", "subscriptions", "stripe", "fastapi", "microservice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
# Coverage assertions live in [tool.coverage.report] below; CI runs pytest
# with --cov=app --cov-report=xml --cov-fail-under=80.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*", "*/test_*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
